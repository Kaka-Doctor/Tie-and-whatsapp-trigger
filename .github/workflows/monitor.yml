name: TIE Library Monitor

on:
  schedule:
    # Every 4 hours at :17 past the hour (UTC). Tanzania = UTC+3 → 03:17,
    # 07:17, 11:17, 15:17, 19:17, 23:17 EAT.
    # NOTE: minute 0 (top of the hour) is GitHub Actions' highest-load slot —
    # scheduled runs there are routinely delayed for hours or dropped, so we
    # deliberately fire off-peak.
    - cron: "17 */4 * * *"
    # Daily WhatsApp digest at 20:03 EAT (17:03 UTC): what TIE uploaded today,
    # or a plain "TIE hasn't uploaded anything today" — sent every day even
    # when nothing changed. (monitor.py also self-catches-up if GitHub drops
    # this run — any later run before EAT midnight sends the summary.)
    - cron: "3 17 * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a test WhatsApp message (checks CallMeBot setup)"
        type: boolean
        default: false
      send_digest:
        description: "Send the daily digest WhatsApp message now (checks the 8 pm EAT summary)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write        # needed to commit state.json back to the repo

concurrency:
  group: tie-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refresh latest monitor state
        # Queued runs can start from an older commit than the latest state
        # commit — always pick up the freshest state.json before running.
        run: |
          git fetch origin main
          git checkout origin/main -- state.json 2>/dev/null \
            || echo "no remote state.json yet (first run)"

      - name: Run TIE monitor
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TEST_MODE: ${{ github.event.inputs.send_test == 'true' && '1' || '0' }}
          # daily digest: scheduled 17:03 UTC run, or a manual dispatch test
          DAILY_DIGEST: ${{ (github.event.schedule == '3 17 * * *' || github.event.inputs.send_digest == 'true') && '1' || '0' }}
          # only the scheduled digest may mark the day as digested, so manual
          # dispatch tests don't suppress the real 8 pm EAT message
          DIGEST_RECORD: ${{ github.event.schedule == '3 17 * * *' && '1' || '0' }}
        run: python3 monitor.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name  "TIE Monitor Bot"
          git config user.email "actions@github.com"
          git add state.json || true
          if git diff --cached --quiet; then
            echo "state.json unchanged"
          else
            git commit -m "chore: monitor state update [skip ci]"
            # if another run pushed state meanwhile, prefer OUR newer state
            if git pull --rebase -X theirs origin main; then
              git push origin main || echo "⚠️ state push failed (will retry next run)"
            else
              git rebase --abort 2>/dev/null || true
              echo "⚠️ state rebase failed — keeping remote state, local state dropped"
            fi
          fi
