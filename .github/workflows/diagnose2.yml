name: Diagnose v3

on:
  workflow_dispatch:
  push:
    branches-ignore: [none]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Find freshest homepage snapshot and download it
        run: |
          TS=$(curl -sS -m 60 "https://web.archive.org/cdx/search/cdx?url=ol.tie.go.tz&output=text&fl=timestamp,statuscode&filter=statuscode:200&from=2026&limit=-3" | tail -1 | cut -d' ' -f1)
          echo "freshest 2026 homepage snapshot: $TS"
          if [ -n "$TS" ]; then
            curl -sS -m 90 "https://web.archive.org/web/${TS}id_/https://ol.tie.go.tz/" -o /tmp/home.html -w "STATUS=%{http_code} SIZE=%{size_download}\n"
            echo "----- homepage HTML (first 2500 chars) -----"
            head -c 2500 /tmp/home.html
            echo ""
            echo "----- script tags -----"
            grep -oE '<script[^>]*src="[^"]*"' /tmp/home.html | head -20
          else
            echo "no 2026 homepage snapshot found"
          fi

      - name: Download archived JS bundles and hunt for API endpoints
        run: |
          mkdir -p /tmp/bundles && cd /tmp/bundles
          for pair in \
            "20260928001058|https://ol.tie.go.tz/assets/antd-wPXBnMD7.js" \
            "20260917142539|https://ol.tie.go.tz/assets/index-Bg_nPIsL.js" \
            "20260917142541|https://ol.tie.go.tz/assets/app-core-zTVgZcMJ.js" \
            "20260917142541|https://ol.tie.go.tz/assets/router-CTgKPny2.js" \
            "20260917142540|https://ol.tie.go.tz/assets/antd-CuyLRo71.js" \
            "20260917142541|https://ol.tie.go.tz/assets/react-query-DnQVTlTn.js" ; do
            TS="${pair%%|*}"; URL="${pair##*|}"
            OUT="/tmp/bundles/$(basename $URL)"
            curl -sS -m 120 "https://web.archive.org/web/${TS}id_/${URL}" -o "$OUT" -w "$URL -> %{http_code} %{size_download}B\n" || echo "$URL FAILED"
          done
          echo "=========== API endpoint hunt ==========="
          cat /tmp/bundles/*.js 2>/dev/null > /tmp/all.js
          echo "--- fetch/axios style paths ---"
          grep -oE '"/api/[a-zA-Z0-9_/{}$.-]*"' /tmp/all.js | sort | uniq -c | sort -rn | head -40 || true
          grep -oE '`/api/[a-zA-Z0-9_/{}$.-]*`' /tmp/all.js | sort -u | head -20 || true
          echo "--- baseURL / API_URL strings ---"
          grep -oE '(baseURL|BASE_URL|apiUrl|API_URL|VITE_[A-Z_]*API[A-Z_]*)["'"'"':= ]+[^,;"'"'"'`]{4,80}' /tmp/all.js | sort -u | head -20 || true
          echo "--- uploaded_files mentions ---"
          grep -oE '.{60}uploaded_files.{60}' /tmp/all.js | head -15 || true
          echo "--- books-related route paths ---"
          grep -oE '"/(books|catalog|collection|library)[a-zA-Z0-9_/{}$.-]*"' /tmp/all.js | sort -u | head -30 || true
          echo "--- full URLs to other hosts (supabase/firebase/etc) ---"
          grep -oE 'https?://[a-zA-Z0-9.-]*\.(com|io|net|org|app|dev|tz)[a-zA-Z0-9_/.-]*' /tmp/all.js | grep -vE 'w3\.org|github|npmjs|mozilla|googleapis/fonts|registry' | sort | uniq -c | sort -rn | head -25 || true
          echo "--- firebase/google config ---"
          grep -oE '(firebaseConfig|authDomain|projectId|apiKey)["'"'"']?\s*[:=]\s*["'"'"'][^"'"'"']{4,60}' /tmp/all.js | sort -u | head -20 || true

      - name: Retry SPN once more (transient check)
        run: |
          curl -sSL -m 240 "https://web.archive.org/save/https://ol.tie.go.tz/" -o /tmp/spn.html -w "SPN STATUS=%{http_code} TOTAL=%{time_total}\n"
          grep -o 'SPN2 Status[^<]*' /tmp/spn.html | head -3 || true

      - name: CDX for frmvi / F6 / Divinity patterns
        run: |
          for q in "adv_secondary/frmvi*" "adv_secondary/*Divinity*" "*Divinity_Form_6*" ; do
            echo "=== CDX $q ==="
            curl -sS -m 60 "https://web.archive.org/cdx/search/cdx?url=ol.tie.go.tz/uploaded_files/books/$q&output=text&fl=timestamp,original,statuscode&limit=50" | head -20
          done
